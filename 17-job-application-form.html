
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Job application form using HTML">
    <title>Job Application Form</title>
</head>
<body>

    <header>
        <h1>Job Application Form</h1>
        <p>Please complete the form to apply for a job position.</p>
    </header>

    <main>
        <form action="#" method="post" enctype="multipart/form-data">

            <fieldset>
                <legend>Personal Information</legend>

                <label for="name">Full Name:</label><br>
                <input type="text" id="name" name="name"
                       placeholder="Enter your full name" required>
                <br><br>

                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required>
                <br><br>

                <label for="phone">Phone Number:</label><br>
                <input type="tel" id="phone" name="phone"
                       placeholder="Enter your phone number" required>
                <br><br>

                <label for="address">Address:</label><br>
                <textarea id="address" name="address" rows="3" cols="35"
                          placeholder="Enter your address"></textarea>
            </fieldset>

            <br>

            <fieldset>
                <legend>Job Details</legend>

                <label for="position">Position Applying For:</label><br>
                <select id="position" name="position" required>
                    <option value="">-- Select a position --</option>
                    <option value="web-developer">Web Developer Intern</option>
                    <option value="java-developer">Java Developer Intern</option>
                    <option value="ai-ml-intern">AI/ML Intern</option>
                    <option value="software-developer">Software Developer</option>
                </select>
                <br><br>

                <label for="experience">Years of Experience:</label><br>
                <input type="number" id="experience" name="experience"
                       min="0" max="50" value="0">
                <br><br>

                <label for="education">Highest Education:</label><br>
                <select id="education" name="education" required>
                    <option value="">-- Select education --</option>
                    <option value="high-school">High School</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="bca">BCA</option>
                    <option value="btech">B.Tech</option>
                    <option value="other">Other</option>
                </select>
                <br><br>

                <p>Skills:</p>
                <input type="checkbox" id="html" name="skills" value="HTML">
                <label for="html">HTML</label>

                <input type="checkbox" id="css" name="skills" value="CSS">
                <label for="css">CSS</label>

                <input type="checkbox" id="java" name="skills" value="Java">
                <label for="java">Java</label>

                <input type="checkbox" id="python" name="skills" value="Python">
                <label for="python">Python</label>

                <input type="checkbox" id="ai" name="skills" value="AI-ML">
                <label for="ai">AI/ML</label>
                <br><br>

                <label for="resume">Upload Resume:</label><br>
                <input type="file" id="resume" name="resume"
                       accept=".pdf,.doc,.docx">
                <br><br>

                <label for="cover-letter">Why should we hire you?</label><br>
                <textarea id="cover-letter" name="cover-letter"
                          rows="5" cols="40"
                          placeholder="Write a short introduction"></textarea>
            </fieldset>

            <br>

            <input type="checkbox" id="confirm" name="confirm" required>
            <label for="confirm">
                I confirm that the information provided is correct.
            </label>

            <br><br>

            <button type="submit">Submit Application</button>
            <button type="reset">Clear Form</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Job Application Form</p>
    </footer>

</body>
</html>
