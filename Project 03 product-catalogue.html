<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalogue Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            text-align: center;
            padding: 50px 20px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000015;
        }

        h1 {
            color: #1e293b;
        }

        p {
            color: #475569;
            line-height: 1.6;
        }

        .note {
            background: #e0f2fe;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Product Catalogue Manager</h1>

        <p>JavaScript ES Modules Project</p>

        <div class="note">
            <h3>Project Status</h3>
            <p>Product data and utility functions are loaded through JavaScript modules.</p>
            <p>Open the browser console using F12 to see the output.</p>
        </div>
    </div>

    <script type="module" src="./app.js"></script>

</body>
</html>
