
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Student registration form using HTML">
    <title>Student Registration Form</title>
</head>
<body>

    <header>
        <h1>Student Registration Form</h1>
        <p>Please fill in your details below.</p>
    </header>

    <main>
        <form action="#" method="get">

            <fieldset>
                <legend>Personal Information</legend>

                <label for="full-name">Full Name:</label><br>
                <input type="text" id="full-name" name="full-name"
                       placeholder="Enter your full name" required>
                <br><br>

                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required>
                <br><br>

                <label for="phone">Phone Number:</label><br>
                <input type="tel" id="phone" name="phone"
                       placeholder="Enter your phone number">
                <br><br>

                <label for="dob">Date of Birth:</label><br>
                <input type="date" id="dob" name="dob" required>
                <br><br>

                <p>Gender:</p>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>

                <input type="radio" id="other" name="gender" value="other">
                <label for="other">Other</label>
            </fieldset>

            <br>

            <fieldset>
                <legend>Academic Information</legend>

                <label for="course">Select Course:</label><br>
                <select id="course" name="course" required>
                    <option value="">-- Choose a course --</option>
                    <option value="bca">BCA</option>
                    <option value="btech">B.Tech</option>
                    <option value="bba">BBA</option>
                    <option value="bsc">B.Sc</option>
                    <option value="other">Other</option>
                </select>
                <br><br>

                <label for="roll-number">Roll Number:</label><br>
                <input type="text" id="roll-number" name="roll-number"
                       placeholder="Enter your roll number">
                <br><br>

                <label for="address">Address:</label><br>
                <textarea id="address" name="address" rows="4" cols="35"
                          placeholder="Enter your address"></textarea>
            </fieldset>

            <br>

            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I confirm that the information is correct.</label>

            <br><br>

            <button type="submit">Register</button>
            <button type="reset">Clear Form</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Student Registration Form</p>
    </footer>

</body>
</html>
