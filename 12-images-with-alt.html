
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HTML images and alt text assignment">
    <title>Images with Alt Text</title>
</head>
<body>

    <header>
        <h1>My Image Gallery</h1>
        <p>Learning how to display images using HTML.</p>
    </header>

    <main>
        <section>
            <h2>Nature</h2>
            <img
                src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=500"
                alt="Beautiful mountains reflected in a clear lake"
                width="300"
            >
        </section>

        <section>
            <h2>Animals</h2>
            <img
                src="https://images.unsplash.com/photo-1552053831-71594a27632d?w=500"
                alt="Golden retriever dog standing outdoors"
                width="300"
            >
        </section>

        <section>
            <h2>Food</h2>
            <img
                src="https://images.unsplash.com/photo-1540189549336-e6e99c3679fe?w=500"
                alt="Healthy salad with fresh vegetables in a bowl"
                width="300"
            >
        </section>

        <section>
            <h2>Why Alt Text Is Important</h2>
            <ul>
                <li>Describes the image if it cannot load.</li>
                <li>Helps screen readers explain images.</li>
                <li>Improves accessibility.</li>
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Kuldeep Maheshwari</p>
    </footer>

</body>
</html>
